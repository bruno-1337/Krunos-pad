<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="KrunosPad - A simple, fast notepad in the cloud. No login required.">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js" defer></script>
    <link rel="stylesheet" href="/css/styles.css">
    <title>KrunosPad - Simple Cloud Notepad</title>
</head>
<body class="landing-page">
    <div class="landing-container">
        <header class="landing-header">
            <h1 class="landing-title">KrunosPad</h1>
            <p class="landing-subtitle">Simple notepad in the cloud</p>
        </header>

        <main class="landing-main">
            <form id="goForm" class="url-form">
                <div class="url-input-wrapper">
                    <span class="url-prefix" aria-hidden="true">/</span>
                    <input 
                        type="text" 
                        id="input-go" 
                        class="url-input" 
                        placeholder="yourpage" 
                        aria-label="Enter page name"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >
                    <button type="submit" class="url-button" aria-label="Go to page">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 10h10M10 5l5 5-5 5"/>
                        </svg>
                    </button>
                </div>
            </form>

            <section class="features">
                <div class="feature">
                    <svg class="feature-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                    </svg>
                    <p>No login required, just use a URL</p>
                </div>
                <div class="feature">
                    <svg class="feature-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    <p>Auto-save as you type</p>
                </div>
                <div class="feature">
                    <svg class="feature-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <p>Real-time collaboration</p>
                </div>
                <div class="feature">
                    <svg class="feature-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <p>Optional password protection</p>
                </div>
                <div class="feature">
                    <svg class="feature-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                        <polyline points="13 2 13 9 20 9"/>
                    </path>
                    <p>Use nested paths like /docs/notes/todo</p>
                </div>
            </section>
        </main>

        <footer class="landing-footer">
            <a href="https://github.com/bruno-1337/Krunos-pad" target="_blank" rel="noopener noreferrer" class="github-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span>View on GitHub</span>
            </a>
        </footer>
    </div>
</body>
</html>
